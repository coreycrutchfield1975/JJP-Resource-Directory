<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJP Resource Directory — 50+ County Resource Guide</title>
<link rel="stylesheet" href="uswds/package/dist/css/uswds.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ── JJP — Rainbow over USWDS ── */
:root{
  --cn-navy:#0f2240;
  --cn-navy2:#17365d;
  --cn-gold:#c9a227;
  --cn-gold2:#f6c344;
  --cn-cyan:#22d3ee;
  --cn-purple:#7c4dff;
  --cn-teal:#14b8a6;
  --cn-green:#2e9d50;
  --cn-red:#e53e3e;
  --cn-orange:#ef7d23;
  --cn-pink:#d7559b;
  --bg:#f0f4f8;
  --surface:#ffffff;
  --border:#d9e1ea;
  --text:#18212b;
  --muted:#5a6c80;
}
body{background:var(--bg);color:var(--text)}
/* Rainbow header */
.usa-header{background:linear-gradient(100deg,var(--cn-navy2),#1f6feb,var(--cn-purple),var(--cn-pink));border-bottom:4px solid var(--cn-gold2)}
.usa-header .usa-logo a{color:#fff;font-weight:700;text-shadow:0 0 12px rgba(255,255,255,.2)}
.jjp-nav{background:var(--surface);border-bottom:1px solid var(--border)}
.jjp-nav .usa-nav__link{font-size:.85rem;padding:.6rem 1rem;color:var(--muted);font-weight:600}
.jjp-nav .usa-nav__link.usa-current{color:var(--cn-navy2);border-bottom:3px solid var(--cn-gold);font-weight:700}
.jjp-nav .usa-nav__link:hover{color:var(--cn-purple)}
.jjp-section{display:none}
.jjp-section.active{display:block}
.jjp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:1rem;margin-bottom:.75rem;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  color:var(--text);
}
.jjp-card:hover{border-color:var(--cn-gold2);box-shadow:0 4px 16px rgba(201,162,39,.15)}
.jjp-card .type-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.type-Emergency{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.type-Food{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
.type-Housing{background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
.type-Veteran{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.type-Community{background:#fefce8;color:#ca8a04;border:1px solid #fef08a}
.type-Assistance{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.type-Transportation{background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}
.type-Legal{background:#fdf2f8;color:#be185d;border:1px solid #fbcfe8}
.type-Health{background:#ecfeff;color:#0e7490;border:1px solid #a5f3fc}
.type-Charity{background:#eef2ff;color:#4338ca;border:1px solid #c7d2fe}
#map{height:450px;border-radius:8px;border:1px solid var(--border)}
.county-chip{
  display:inline-block;padding:4px 10px;margin:3px;border-radius:20px;
  background:var(--surface);color:var(--cn-navy2);font-size:.8rem;
  cursor:pointer;transition:all .15s;border:2px solid var(--border);font-weight:600;
}
.county-chip:hover{background:var(--cn-gold2);border-color:var(--cn-gold);color:var(--cn-navy2)}
.county-chip.active{background:var(--cn-gold);color:var(--cn-navy2);border-color:var(--cn-gold)}

/* Inputs — light */
.usa-input,.usa-select,.usa-textarea{
  background:var(--surface);border:2px solid var(--border);
  color:var(--text);border-radius:8px;
}
.usa-input:focus,.usa-select:focus{border-color:var(--cn-gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.usa-button{background:var(--cn-navy2);color:#fff;font-weight:700;border:none;border-radius:8px}
.usa-button:hover{background:var(--cn-purple);box-shadow:0 4px 16px rgba(124,77,255,.25);color:#fff}
.usa-button--outline{background:transparent;border:2px solid var(--border);color:var(--cn-navy2);font-weight:600}
.usa-button--outline:hover{background:var(--cn-navy2);border-color:var(--cn-navy2);color:#fff}
.usa-table{color:var(--text)}
.usa-table thead th{background:var(--cn-navy2);color:#fff;border-color:var(--cn-navy2)}
.usa-table td{border-color:var(--border)}
.usa-table tbody tr:nth-child(even){background:rgba(15,34,64,.03)}
.usa-hint{color:var(--muted)}
@media print{.usa-header,.jjp-nav{display:none!important}.jjp-section{display:block!important}}
/* Card action menu */
.card-menu{position:relative;display:inline-block}
.card-menu-btn{background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 8px;border-radius:4px;line-height:1}
.card-menu-btn:hover{background:var(--cn-navy2);color:#fff;border-color:var(--cn-navy2)}
.card-menu-dropdown{display:none;position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:150px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px 0}
.card-menu-dropdown a,.card-menu-dropdown button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 14px;font-size:.8rem;cursor:pointer;text-decoration:none}
.card-menu-dropdown a:hover,.card-menu-dropdown button:hover{background:var(--cn-navy2);color:#fff}
/* Grid view */
#res-list.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.75rem}
#res-list.grid-view .jjp-card{margin-bottom:0}
@media (max-width:700px){#res-list.grid-view{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- HEADER -->
<header class="usa-header usa-header--basic">
  <div class="usa-nav-container">
    <div class="usa-logo">
      <em class="usa-logo__text"><a href="#">📋 JJP Resource Directory</a></em>
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="jjp-nav">
  <div class="usa-nav-container" style="padding:0">
    <ul class="usa-nav__primary" style="display:flex;list-style:none;margin:0;padding:0;overflow-x:auto">
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link usa-current" onclick="showTab('resources',this)">📂 Resources</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('hotlines',this)">📞 Hotlines</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('nursing',this)">🏥 Nursing Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('care',this)">🏠 Care Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('map',this)">🗺️ Map</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('counties',this)">📍 Counties</a></li>
    </ul>
  </div>
</nav>

<main class="usa-section" style="padding-top:1.5rem;max-width:1400px;margin:0 auto">

  <!-- RESOURCES -->
  <div id="tab-resources" class="jjp-section active">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="res-search" placeholder="Search resources…" oninput="renderResources()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-type" onchange="renderResources()">
          <option value="">All Types</option>
          <option>Emergency</option><option>Food</option><option>Housing</option><option>Veteran</option>
          <option>Community</option><option>Assistance</option><option>Transportation</option><option>Legal</option>
          <option>Health</option><option>Charity</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-county" onchange="renderResources()">
          <option value="">All Counties</option>
        </select>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;gap:8px;flex-wrap:wrap">
      <span id="res-count-display" class="usa-hint"></span>
      <div style="display:flex;gap:6px">
        <button class="usa-button usa-button--outline" onclick="toggleGridView()" style="font-size:.75rem;padding:4px 12px" id="grid-toggle-btn">⊞ Grid View</button>
        <button class="usa-button usa-button--outline" onclick="printAllResources()" style="font-size:.75rem;padding:4px 12px">🖨️ Print These Results</button>
      </div>
    </div>
    <div id="res-list"><span class="usa-hint">Loading resources…</span></div>
  </div>

  <!-- HOTLINES -->
  <div id="tab-hotlines" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="hot-search" placeholder="Search hotlines…" oninput="renderHotlines()">
      </div>
      <div class="tablet:grid-col-6">
        <select class="usa-select" id="hot-category" onchange="renderHotlines()">
          <option value="">All Categories</option>
          <option>Crisis</option><option>Emergency</option><option>Veteran Services</option>
          <option>Mental Health</option><option>Healthcare</option><option>Legal</option>
          <option>Senior Services</option><option>Social Services</option>
        </select>
      </div>
    </div>
    <div id="hot-list"><span class="usa-hint">Loading hotlines…</span></div>
  </div>

  <!-- NURSING HOMES -->
  <div id="tab-nursing" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="nh-search" placeholder="Search nursing homes…" oninput="renderNursingHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-state" onchange="renderNursingHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-county" onchange="renderNursingHomes()"><option value="">All Counties</option></select>
      </div>
    </div>
    <div id="nh-list"><span class="usa-hint">Loading nursing homes…</span></div>
  </div>

  <!-- CARE HOMES -->
  <div id="tab-care" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="ch-search" placeholder="Search care homes…" oninput="renderCareHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-state" onchange="renderCareHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-type" onchange="renderCareHomes()">
          <option value="">All Types</option>
          <option value="RCF">Residential Care Facility</option>
          <option value="ALF">Assisted Living Facility</option>
          <option value="ICF">Intermediate Care Facility</option>
        </select>
      </div>
    </div>
    <div id="ch-list"><span class="usa-hint">Loading care homes…</span></div>
  </div>

  <!-- MAP -->
  <div id="tab-map" class="jjp-section">
    <div id="map"></div>
  </div>

  <!-- COUNTIES -->
  <div id="tab-counties" class="jjp-section">
    <h2 class="font-heading-lg">📍 Counties Served</h2>
    <div id="county-list"></div>
  </div>
</main>

<script src="uswds/package/dist/js/uswds.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="jjp-data.js"></script>
<script src="jjp-app.js"></script>
</body>
</html>
