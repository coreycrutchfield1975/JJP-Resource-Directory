<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJP Resource Directory — 50+ County Resource Guide</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
<link rel="preload" href="uswds/package/dist/css/uswds.min.css" as="style">
<link rel="stylesheet" href="uswds/package/dist/css/uswds.min.css">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
/* ── JJP — Dark Navy/Gold (VA CLC Theme) ── */
:root{
  --cn-navy:#0a192f;
  --cn-navy2:#112240;
  --cn-gold:#c9a227;
  --cn-gold2:#f6c344;
  --cn-cyan:#22d3ee;
  --cn-purple:#7c4dff;
  --cn-teal:#14b8a6;
  --cn-green:#2e9d50;
  --cn-red:#e53e3e;
  --cn-orange:#ef7d23;
  --cn-pink:#d7559b;
  --bg:#0a192f;
  --surface:#112240;
  --border:#1d3557;
  --text:#e2e8f0;
  --muted:#94a3b8;
}
body{background:var(--bg);color:var(--text)}
/* Rainbow header */
.usa-header{background:linear-gradient(100deg,var(--cn-navy2),var(--cn-purple),var(--cn-pink),var(--cn-gold2));border-bottom:4px solid var(--cn-gold2)}
.usa-header .usa-logo a{color:var(--text);font-weight:700;text-shadow:0 0 12px rgba(255,255,255,.2)}
.jjp-nav{background:var(--surface);border-bottom:1px solid var(--border)}
.jjp-nav .usa-nav__link{font-size:.85rem;padding:.6rem 1rem;color:var(--muted);font-weight:600}
.jjp-nav .usa-nav__link.usa-current{color:var(--cn-gold2);border-bottom:3px solid var(--cn-gold);font-weight:700}
.jjp-nav .usa-nav__link:hover{color:var(--cn-purple)}
.jjp-section{display:none}
.jjp-section.active{display:block}

/* Responsive grid for cards */
.jjp-list{display:grid;grid-gap:1rem;grid-template-columns:1fr}
@media (min-width:768px){.jjp-list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.jjp-list{grid-template-columns:repeat(3,1fr)}}

.jjp-card{
  background:var(--cn-surface);
  border:1px solid var(--cn-border);border-radius:10px;
  padding:1rem;min-height:88px;
  box-shadow:0 6px 18px rgba(11,43,59,0.06);
  color:var(--cn-text);
  display:flex;flex-direction:column;justify-content:space-between;
}
.jjp-card:hover{border-color:var(--cn-gold2);box-shadow:0 4px 16px rgba(201,162,39,.15)}
.jjp-card .type-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.type-Emergency{background:rgba(220,38,38,0.15);color:#fca5a5;border:1px solid rgba(220,38,38,0.3)}
.type-Food{background:rgba(34,197,94,0.15);color:#86efac;border:1px solid rgba(34,197,94,0.3)}
.type-Housing{background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.3)}
.type-Veteran{background:rgba(139,92,246,0.15);color:#c4b5fd;border:1px solid rgba(139,92,246,0.3)}
.type-Community{background:rgba(245,158,11,0.15);color:#fcd34d;border:1px solid rgba(245,158,11,0.3)}
.type-Assistance{background:rgba(249,115,22,0.15);color:#fdba74;border:1px solid rgba(249,115,22,0.3)}
.type-Transportation{background:rgba(20,184,166,0.15);color:#5eead4;border:1px solid rgba(20,184,166,0.3)}
.type-Legal{background:rgba(190,24,93,0.15);color:#f9a8d4;border:1px solid rgba(190,24,93,0.3)}
.type-Health{background:rgba(14,116,144,0.15);color:#7dd3fc;border:1px solid rgba(14,116,144,0.3)}
.type-Charity{background:rgba(67,56,202,0.15);color:#a5b4fc;border:1px solid rgba(67,56,202,0.3)}
#map{height:450px;border-radius:8px;border:1px solid var(--border)}
.county-chip{
  display:inline-block;padding:4px 10px;margin:3px;border-radius:20px;
  background:var(--surface);color:var(--muted);font-size:.8rem;
  cursor:pointer;transition:all .15s;border:2px solid var(--border);font-weight:600;
}
.county-chip:hover{background:var(--cn-gold2);border-color:var(--cn-gold);color:var(--bg)}
.county-chip.active{background:var(--cn-gold);color:var(--bg);border-color:var(--cn-gold)}


/* Action buttons inside cards */
.jjp-card .usa-button,.jjp-card .usa-button--outline{padding:.6rem .9rem;min-height:40px;font-size:.95rem;border-radius:8px}
.usa-button{background:var(--cn-accent);color:#ffffff;font-weight:700;border:none}
.usa-button--outline{background:transparent;border:1px solid var(--cn-border);color:var(--cn-accent)}
.usa-button--outline:hover{background:rgba(43,155,163,0.06)}

.action-small{padding:.4rem .6rem;font-size:.88rem;border-radius:6px}

/* Compact action menu styles */
.action-menu-container{position:relative;display:inline-block}
.menu-button{display:inline-flex;align-items:center;gap:8px}
.action-menu{min-width:160px;display:none;position:fixed;right:auto;z-index:60;padding:8px;background:var(--cn-surface);border:1px solid var(--cn-border);box-shadow:0 6px 18px rgba(11,43,59,0.08);border-radius:8px;overflow:auto;max-height:50vh;-webkit-overflow-scrolling:touch}
.action-menu button{display:block;width:100%;text-align:left;margin:6px 0;padding:8px;border-radius:6px}
.action-menu button:focus{outline:3px solid rgba(43,155,163,.18);outline-offset:2px}

.usa-table{color:var(--cn-text)}
.usa-table thead th{background:rgba(0,0,0,0.04);color:var(--cn-muted);border-color:var(--cn-border)}
.usa-table td{border-color:var(--cn-border)}
.usa-hint{color:var(--cn-muted)}

/* Skip link — visible when focused for keyboard users */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip-link:focus{position:fixed;left:16px;top:12px;width:auto;height:auto;padding:8px 12px;background:var(--cn-accent);color:#fff;border-radius:6px;z-index:9999}

/* County toolbar sticky so print/share controls remain visible while scrolling */
.county-toolbar{position:sticky;top:72px;z-index:40;background:transparent;padding:0 0 12px 0}

/* Visible and consistent focus styles for keyboard navigation */
:focus{outline:3px solid rgba(43,155,163,.18);outline-offset:2px}

/* Print-friendly styles: simplified layout and readable colors */
@media print{
  body{background:white;color:black}
  .usa-header,.jjp-nav{display:none!important}
  .jjp-section{display:block!important}
  .jjp-card{background:white;color:black;border:none;box-shadow:none}
  .usa-button,.usa-button--outline,.county-chip{display:none}
  .jjp-list{grid-template-columns:1fr}
}
.usa-input:focus,.usa-select:focus{border-color:var(--cn-gold);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.usa-button{background:var(--cn-navy2);color:#fff;font-weight:700;border:none;border-radius:8px}
.usa-button:hover{background:var(--cn-purple);box-shadow:0 4px 16px rgba(124,77,255,.25);color:#fff}
.usa-button--outline{background:transparent;border:2px solid var(--border);color:var(--muted);font-weight:600}
.usa-button--outline:hover{background:var(--surface);border-color:var(--cn-gold);color:var(--cn-gold2)}
.usa-table{color:var(--text)}
.usa-table thead th{background:var(--cn-navy2);color:#fff;border-color:var(--cn-navy2)}
.usa-table td{border-color:var(--border)}
.usa-table tbody tr:nth-child(even){background:rgba(15,34,64,.03)}
.usa-hint{color:var(--muted)}
@media print{.usa-header,.jjp-nav{display:none!important}.jjp-section{display:block!important}}
/* Card action menu */
.card-menu{position:relative;display:inline-block}
.card-menu-btn{background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 8px;border-radius:4px;line-height:1}
.card-menu-btn:hover{background:var(--cn-navy2);color:var(--text);border-color:var(--cn-navy2)}
.card-menu-dropdown{display:none;position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:150px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:4px 0}
.card-menu-dropdown a,.card-menu-dropdown button{display:block;width:100%;text-align:left;background:transparent;border:none;color:var(--text);padding:8px 14px;font-size:.8rem;cursor:pointer;text-decoration:none}
.card-menu-dropdown a:hover,.card-menu-dropdown button:hover{background:var(--cn-gold);color:var(--bg)}
/* Card text classes */
.card-meta{font-size:.85rem;color:var(--muted);margin-top:4px}
.card-notes{font-size:.8rem;color:var(--muted);margin-top:6px;font-style:italic}
/* Print phone class */
.print-phone{display:inline-block;padding:4px 12px;font-size:.75rem;color:#17365d}
/* Grid view */
#res-list.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.75rem}
#res-list.grid-view .jjp-card{margin-bottom:0}
@media (max-width:700px){#res-list.grid-view{grid-template-columns:1fr}}

/* Modal styling */
.modal button[type="submit"],
.modal-btn-save {
  background: var(--cn-gold) !important;
  color: var(--bg) !important;
  border: none !important;
  border-radius: 6px !important;
  padding: 8px 20px !important;
  font-weight: 700 !important;
  cursor: pointer !important;
}
.modal-btn-save:hover {
  background: var(--cn-gold2) !important;
}
.modal button[type="button"],
.modal-btn-cancel {
  background: var(--surface) !important;
  border: 2px solid var(--border) !important;
  border-radius: 6px !important;
  padding: 8px 20px !important;
  font-weight: 600 !important;
  cursor: pointer !important;
  color: var(--muted) !important;
}
.modal-btn-cancel:hover {
  border-color: var(--cn-gold) !important;
  color: var(--text) !important;
}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- HEADER -->
<header class="usa-header usa-header--basic">
  <div class="usa-nav-container">
    <div class="usa-logo">
      <em class="usa-logo__text"><a href="#">📋 JJP Resource Directory</a></em>
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="jjp-nav">
  <div class="usa-nav-container" style="padding:0">
    <ul class="usa-nav__primary" style="display:flex;list-style:none;margin:0;padding:0;overflow-x:auto">
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link usa-current" onclick="showTab('resources',this)">📂 Resources</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('hotlines',this)">📞 Hotlines</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('nursing',this)">🏥 Nursing Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('care',this)">🏠 Care Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('map',this)">🗺️ Map</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('counties',this)">📍 Counties/Print</a></li>
    </ul>
  </div>
</nav>

<main id="main-content" class="usa-section" style="padding-top:1.5rem;max-width:1400px;margin:0 auto">

  <!-- RESOURCES -->
  <div id="tab-resources" class="jjp-section active">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="res-search" placeholder="Search resources…" oninput="renderResources()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-type" onchange="renderResources()">
          <option value="">All Types</option>
          <option>Emergency</option><option>Food</option><option>Housing</option><option>Veteran</option>
          <option>Community</option><option>Assistance</option><option>Transportation</option><option>Legal</option>
          <option>Health</option><option>Charity</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-county" onchange="renderResources()">
          <option value="">All Counties</option>
        </select>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;gap:8px;flex-wrap:wrap">
      <span id="res-count-display" class="usa-hint"></span>
      <div style="display:flex;gap:6px">
        <button class="usa-button usa-button--outline" onclick="toggleGridView()" style="font-size:.75rem;padding:4px 12px" id="grid-toggle-btn">⊞ Grid View</button>
        <button class="usa-button usa-button--outline" onclick="printAllResources()" style="font-size:.75rem;padding:4px 12px">🖨️ Print These Results</button>
      </div>
    </div>
    <div id="res-list"><span class="usa-hint">Loading resources…</span></div>
  </div>

  <!-- HOTLINES -->
  <div id="tab-hotlines" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="hot-search" placeholder="Search hotlines…" oninput="renderHotlines()">
      </div>
      <div class="tablet:grid-col-6">
        <select class="usa-select" id="hot-category" onchange="renderHotlines()">
          <option value="">All Categories</option>
          <option>Crisis</option><option>Emergency</option><option>Veteran Services</option>
          <option>Mental Health</option><option>Healthcare</option><option>Legal</option>
          <option>Senior Services</option><option>Social Services</option>
        </select>
      </div>
    </div>
    <div id="hot-list"><span class="usa-hint">Loading hotlines…</span></div>
  </div>

  <!-- NURSING HOMES -->
  <div id="tab-nursing" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="nh-search" placeholder="Search nursing homes…" oninput="renderNursingHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-state" onchange="renderNursingHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-county" onchange="renderNursingHomes()"><option value="">All Counties</option></select>
      </div>
    </div>
    <div id="nh-list"><span class="usa-hint">Loading nursing homes…</span></div>
  </div>

  <!-- CARE HOMES -->
  <div id="tab-care" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="ch-search" placeholder="Search care homes…" oninput="renderCareHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-state" onchange="renderCareHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-type" onchange="renderCareHomes()">
          <option value="">All Types</option>
          <option value="RCF">Residential Care Facility</option>
          <option value="ALF">Assisted Living Facility</option>
          <option value="ICF">Intermediate Care Facility</option>
        </select>
      </div>
    </div>
    <div id="ch-list"><span class="usa-hint">Loading care homes…</span></div>
  </div>

  <!-- MAP -->
  <div id="tab-map" class="jjp-section">
    <div id="map"></div>
  </div>

  <!-- COUNTIES -->
  <div id="tab-counties" class="jjp-section">
    <h2 class="font-heading-lg">📍 Counties / Print</h2>
    <!-- County toolbar: select + actions -->
    <div class="county-toolbar" style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <label for="county-top-select" class="usa-hint" style="margin-right:6px">Select county:</label>
      <select id="county-top-select" class="usa-select" aria-label="Select county to act on" onchange="onCountyToolbarChange()">
        <option value="">-- Choose a county --</option>
      </select>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button id="county-share-btn" class="usa-button--outline action-small" onclick="shareCountyFromToolbar()" aria-label="Share selected county" disabled>🔗 Share</button>
        <button id="county-text-btn" class="usa-button--outline action-small" onclick="textCountyFromToolbar()" aria-label="Text selected county" disabled>✉️ Text</button>
        <button id="county-print-btn" class="usa-button action-small" onclick="printCountyFromToolbar()" aria-label="Print selected county" disabled>🖨️ Print</button>
        <button id="county-copy-btn" class="usa-button--outline action-small" onclick="copyCountyLinkFromToolbar()" aria-label="Copy link for selected county" disabled>📋 Copy</button>
      </div>
    </div>
    <div id="county-list"></div>
    <div id="aria-announcer" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);"></div>
  </div>
</main>

<script src="uswds/package/dist/js/uswds.min.js"></script>
<script src="leaflet/leaflet.js"></script>
<script src="jjp-data.js"></script>
<script src="jjp-app-enhanced.js"></script>
</body>
</html>
