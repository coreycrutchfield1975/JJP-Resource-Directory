<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JJP Resource Directory — 50+ County Resource Guide</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.svg">
<link rel="preload" href="uswds/package/dist/css/uswds.min.css" as="style">
<link rel="stylesheet" href="uswds/package/dist/css/uswds.min.css">
<!-- Leaflet CSS will load on-demand when the map tab is opened to improve initial load -->
<style>
/* ── JJP — Lighter VA-friendly palette over USWDS ── */
:root{
 /* Lighter, colorized VA-friendly palette */
 --cn-bg:#f6f9fb; /* page background: very light blue-gray */
 --cn-surface:#ffffff; /* card surface */
 --cn-border:rgba(11,43,59,0.08); /* subtle border */
 --cn-text:#0b2b3b; /* dark, highly readable text */
 --cn-muted:#546e7a; /* muted text for hints */
 --cn-accent:#2b9ba3; /* teal accent */
 --cn-gold:#c9a227;
 --cn-gold2:#e2c96e;
 --cn-cyan:#22d3ee;
 --cn-navy:#093047;
 --cn-navy2:#14495f;
}
html{font-size:0.95rem;} /* minimum base font size for readability */
body{background:linear-gradient(180deg,var(--cn-bg),#eef6f9 60%);color:var(--cn-text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,'Helvetica Neue',Arial}
.usa-header{background:linear-gradient(180deg,var(--cn-accent),rgba(43,155,163,0.9));border-bottom:2px solid rgba(11,43,59,0.06)}
.usa-header .usa-logo a{color:white;font-weight:700}
.jjp-nav{background:transparent;backdrop-filter:none;border-bottom:1px solid rgba(11,43,59,0.04)}
.jjp-nav .usa-nav__link{font-size:0.98rem;padding:.65rem 1rem;color:var(--cn-text)}
.jjp-nav .usa-nav__link.usa-current{color:var(--cn-accent);border-bottom:2px solid var(--cn-accent);font-weight:700}
.jjp-nav .usa-nav__link:hover{color:var(--cn-accent)}
.jjp-section{display:none}
.jjp-section.active{display:block}

/* Responsive grid for cards */
.jjp-list{display:grid;grid-gap:1rem;grid-template-columns:1fr}
@media (min-width:768px){.jjp-list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1024px){.jjp-list{grid-template-columns:repeat(3,1fr)}}

.jjp-card{
  background:var(--cn-surface);
  border:1px solid var(--cn-border);border-radius:10px;
  padding:1rem;min-height:88px;
  box-shadow:0 6px 18px rgba(11,43,59,0.06);
  color:var(--cn-text);
  display:flex;flex-direction:column;justify-content:space-between;
}
.jjp-card:hover{transform:translateY(-2px);border-color:rgba(11,43,59,.12);box-shadow:0 12px 28px rgba(11,43,59,.08)}
.jjp-card .type-badge{display:inline-block;padding:6px 10px;border-radius:8px;font-size:.88rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Rainbow-friendly accessible palette for badges (soft backgrounds, strong contrast text) */
.type-Emergency{background:#FFECEC;color:#7f1d1d}
.type-Food{background:#E6F9EC;color:#0b5a2b}
.type-Housing{background:#EAF2FF;color:#08306b}
.type-Veteran{background:#F3E8FF;color:#4c1366}
.type-Community{background:#FFF4E6;color:#6b3e00}
.type-Assistance{background:#FFF0EA;color:#7a2b16}
.type-Transportation{background:#E8FCF9;color:#0b5a4a}
.type-Legal{background:#FFF0F6;color:#5b0f3a}
.type-Health{background:#EAF7FF;color:#03303a}
.type-Charity{background:#F0F3FF;color:#1e276a}

#map{height:450px;border-radius:8px;border:1px solid var(--cn-border)}

/* County chips are buttons now for accessibility */
.county-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;margin:6px;border-radius:20px;background:transparent;color:var(--cn-accent);font-size:.95rem;cursor:pointer;transition:all .12s;border:1px solid rgba(11,43,59,0.04)}
.county-chip:hover{background:rgba(43,155,163,0.06);border-color:var(--cn-accent)}
.county-chip.active{background:var(--cn-accent);color:white}
.county-chip:focus{outline:3px solid rgba(43,155,163,.18);outline-offset:2px}

/* USWDS overrides */
.usa-input,.usa-select,.usa-textarea{background:var(--cn-surface);border:1px solid var(--cn-border);color:var(--cn-text);border-radius:6px;padding:.6rem;min-height:44px}
/* Make native select dropdowns easier to read: simple arrow using accent */
.usa-select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg, transparent 50%, var(--cn-accent) 50%), linear-gradient(135deg, var(--cn-accent) 50%, transparent 50%), linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,0));background-position:calc(100% - 20px) calc(1em + 2px), calc(100% - 15px) calc(1em + 2px), 100% 0;background-size:6px 6px,6px 6px,2.5em 2.5em;background-repeat:no-repeat;padding-right:2.6em}
.usa-select option{background:var(--cn-surface);color:var(--cn-text);}
.usa-select optgroup{background:var(--cn-surface);color:var(--cn-text);}
.usa-input:focus,.usa-select:focus{border-color:var(--cn-accent);box-shadow:0 0 0 4px rgba(43,155,163,.12);outline:none}
/* Remove low-contrast dropdown native arrow backgrounds on some browsers */
.usa-select::-ms-expand{display:none}
@media (prefers-contrast: more){
  .usa-input,.usa-select,.usa-textarea{border-width:2px}
}


/* Action buttons inside cards */
.jjp-card .usa-button,.jjp-card .usa-button--outline{padding:.6rem .9rem;min-height:40px;font-size:.95rem;border-radius:8px}
.usa-button{background:var(--cn-accent);color:#ffffff;font-weight:700;border:none}
.usa-button--outline{background:transparent;border:1px solid var(--cn-border);color:var(--cn-accent)}
.usa-button--outline:hover{background:rgba(43,155,163,0.06)}

.action-small{padding:.4rem .6rem;font-size:.88rem;border-radius:6px}

.usa-table{color:var(--cn-text)}
.usa-table thead th{background:rgba(0,0,0,0.04);color:var(--cn-muted);border-color:var(--cn-border)}
.usa-table td{border-color:var(--cn-border)}
.usa-hint{color:var(--cn-muted)}

/* Skip link — visible when focused for keyboard users */
.skip-link{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
.skip-link:focus{position:fixed;left:16px;top:12px;width:auto;height:auto;padding:8px 12px;background:var(--cn-accent);color:#fff;border-radius:6px;z-index:9999}

/* County toolbar sticky so print/share controls remain visible while scrolling */
.county-toolbar{position:sticky;top:72px;z-index:40;background:transparent;padding:0 0 12px 0}

/* Visible and consistent focus styles for keyboard navigation */
:focus{outline:3px solid rgba(43,155,163,.18);outline-offset:2px}

/* Print-friendly styles: simplified layout and readable colors */
@media print{
  body{background:white;color:black}
  .usa-header,.jjp-nav{display:none!important}
  .jjp-section{display:block!important}
  .jjp-card{background:white;color:black;border:none;box-shadow:none}
  .usa-button,.usa-button--outline,.county-chip{display:none}
  .jjp-list{grid-template-columns:1fr}
}
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>

<!-- HEADER -->
<header class="usa-header usa-header--basic">
  <div class="usa-nav-container">
    <div class="usa-logo">
      <em class="usa-logo__text"><a href="#">📋 JJP Resource Directory</a></em>
    </div>
  </div>
</header>

<!-- NAV -->
<nav class="jjp-nav">
  <div class="usa-nav-container" style="padding:0">
    <ul class="usa-nav__primary" style="display:flex;list-style:none;margin:0;padding:0;overflow-x:auto">
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link usa-current" onclick="showTab('resources',this)">📂 Resources</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('hotlines',this)">📞 Hotlines</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('nursing',this)">🏥 Nursing Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('care',this)">🏠 Care Homes</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('map',this)">🗺️ Map</a></li>
      <li class="usa-nav__primary-item"><a href="#" class="usa-nav__link" onclick="showTab('counties',this)">📍 Counties/Print</a></li>
    </ul>
  </div>
</nav>

<main id="main-content" class="usa-section" style="padding-top:1.5rem;max-width:1400px;margin:0 auto">

  <!-- RESOURCES -->
  <div id="tab-resources" class="jjp-section active">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="res-search" placeholder="Search resources…" oninput="renderResources()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-type" onchange="renderResources()">
          <option value="">All Types</option>
          <option>Emergency</option><option>Food</option><option>Housing</option><option>Veteran</option>
          <option>Community</option><option>Assistance</option><option>Transportation</option><option>Legal</option>
          <option>Health</option><option>Charity</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="res-county" onchange="renderResources()">
          <option value="">All Counties</option>
        </select>
      </div>
    </div>
    <div id="res-list"><span class="usa-hint">Loading resources…</span></div>
  </div>

  <!-- HOTLINES -->
  <div id="tab-hotlines" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="hot-search" placeholder="Search hotlines…" oninput="renderHotlines()">
      </div>
      <div class="tablet:grid-col-6">
        <select class="usa-select" id="hot-category" onchange="renderHotlines()">
          <option value="">All Categories</option>
          <option>Crisis</option><option>Emergency</option><option>Veteran Services</option>
          <option>Mental Health</option><option>Healthcare</option><option>Legal</option>
          <option>Senior Services</option><option>Social Services</option>
        </select>
      </div>
    </div>
    <div id="hot-list"><span class="usa-hint">Loading hotlines…</span></div>
  </div>

  <!-- NURSING HOMES -->
  <div id="tab-nursing" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="nh-search" placeholder="Search nursing homes…" oninput="renderNursingHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-state" onchange="renderNursingHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="nh-county" onchange="renderNursingHomes()"><option value="">All Counties</option></select>
      </div>
    </div>
    <div id="nh-list"><span class="usa-hint">Loading nursing homes…</span></div>
  </div>

  <!-- CARE HOMES -->
  <div id="tab-care" class="jjp-section">
    <div class="grid-row grid-gap margin-bottom-2">
      <div class="tablet:grid-col-6">
        <input class="usa-input" id="ch-search" placeholder="Search care homes…" oninput="renderCareHomes()">
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-state" onchange="renderCareHomes()">
          <option value="">All States</option><option>MO</option><option>AR</option><option>KS</option><option>IL</option>
        </select>
      </div>
      <div class="tablet:grid-col-3">
        <select class="usa-select" id="ch-type" onchange="renderCareHomes()">
          <option value="">All Types</option>
          <option value="RCF">Residential Care Facility</option>
          <option value="ALF">Assisted Living Facility</option>
          <option value="ICF">Intermediate Care Facility</option>
        </select>
      </div>
    </div>
    <div id="ch-list"><span class="usa-hint">Loading care homes…</span></div>
  </div>

  <!-- MAP -->
  <div id="tab-map" class="jjp-section">
    <div id="map"></div>
  </div>

  <!-- COUNTIES -->
  <div id="tab-counties" class="jjp-section">
    <h2 class="font-heading-lg">📍 Counties / Print</h2>
    <!-- County toolbar: select + actions -->
    <div class="county-toolbar" style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <label for="county-top-select" class="usa-hint" style="margin-right:6px">Select county:</label>
      <select id="county-top-select" class="usa-select" aria-label="Select county to act on" onchange="onCountyToolbarChange()">
        <option value="">-- Choose a county --</option>
      </select>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button id="county-share-btn" class="usa-button--outline action-small" onclick="shareCountyFromToolbar()" aria-label="Share selected county" disabled>🔗 Share</button>
        <button id="county-text-btn" class="usa-button--outline action-small" onclick="textCountyFromToolbar()" aria-label="Text selected county" disabled>✉️ Text</button>
        <button id="county-print-btn" class="usa-button action-small" onclick="printCountyFromToolbar()" aria-label="Print selected county" disabled>🖨️ Print</button>
        <button id="county-copy-btn" class="usa-button--outline action-small" onclick="copyCountyLinkFromToolbar()" aria-label="Copy link for selected county" disabled>📋 Copy</button>
      </div>
    </div>
    <div id="county-list"></div>
    <div id="aria-announcer" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);"></div>
  </div>
</main>

<script src="uswds/package/dist/js/uswds.min.js" defer></script>
<!-- Leaflet JS will be loaded on demand in initMap() -->
<script src="jjp-data.js" defer></script>
<script src="jjp-app.js" defer></script>
<script>
// Improve keyboard activation: Enter on a focused card activates the first actionable link inside it
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('jjp-card')){
    var link = document.activeElement.querySelector('a');
    if(link){
      try{ link.focus(); link.click(); }catch(err){ link.focus(); }
      e.preventDefault();
    }
  }
});
</script>
</body>
</html>
